<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake: Side-Window Edition</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
            box-sizing: border-box;
        }
        .controls-panel {
            margin-bottom: 15px;
            text-align: center;
            z-index: 10;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        button.active {
            background: #ff5722;
        }
        button.active:hover {
            background: #e64a19;
        }
        .canvas-container {
            width: 100%;
            position: relative; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: max-width 0.3s ease;
        }
        .canvas-container.normal {
            max-width: 360px; 
        }
        .canvas-container.compact {
            max-width: 234px; 
        }
        canvas {
            background: #111;
            border: 3px solid #4CAF50;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #scoreBoard {
            font-size: 18px;
            margin-top: 8px;
            font-weight: bold;
        }
        #fullScreenCover {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }
        #fullScreenCover img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 17, 0.95);
            border: 3px solid #4CAF50;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            text-align: center;
            padding: 15px;
        }
        #startScreen h1 {
            margin: 0 0 5px 0;
            color: #4CAF50;
            font-size: 26px;
        }
        .controls-list {
            font-size: 12px;
            color: #bbb;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .menu-section {
            margin-bottom: 12px;
            width: 100%;
        }
        .mode-btn {
            background: #333;
            border: 2px solid #555;
            margin: 0 5px;
            padding: 6px 12px;
            font-size: 12px;
        }
        .mode-btn.selected {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .mode-btn.selected#chaoticBtn {
            background: #d32f2f;
            border-color: #d32f2f;
        }
        .config-select {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        #startBtn {
            font-size: 16px;
            padding: 10px 25px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            margin-top: 5px;
        }
        #adminPanel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-top: 2px solid #ff9800;
            padding: 12px;
            box-sizing: border-box;
            z-index: 10000;
            font-family: monospace;
        }
        .command-help {
            font-size: 12px;
            color: #ffa726;
            margin-bottom: 6px;
        }
        #cmdInput {
            width: 100%;
            background: #000;
            border: 1px solid #ff9800;
            color: #00ff00;
            padding: 8px;
            font-family: monospace;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        #hollywoodOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #050505;
            z-index: 99999;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            color: #00ff33;
            font-size: 11px;
            line-height: 1.3;
        }
        .matrix-column {
            position: absolute;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #subhaanOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }
        .slide-in-text {
            font-family: monospace;
            white-space: pre;
            color: #00ff33;
            font-size: 12px;
            line-height: 1.3;
            text-align: left;
            animation: slideInLeft 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes slideInLeft {
            0% { transform: translateX(-150%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Full screen container for the M key image -->
    <div id="fullScreenCover">
        <img src="coverimage.png" alt="Cover Image">
    </div>

    <!-- Hidden Admin Terminal Interface Box -->
    <div id="adminPanel">
        <div class="command-help">
            <strong>Available Commands:</strong> /points [number] | /colour [color_name or rainbow]
        </div>
        <input type="text" id="cmdInput" placeholder="Type a command and press Enter..." autocomplete="off">
    </div>

    <!-- Top Secret Hollywood Shell simulation stream overlay box -->
    <div id="hollywoodOverlay"></div>

    <!-- Secret Sliding Subhaan Art Banner Window -->
    <div id="subhaanOverlay"></div>

    <div class="controls-panel">
        <button id="modeToggle">Toggle Compact Mode</button>
        <div id="scoreBoard">Score: 0</div>
    </div>

    <div id="container" class="canvas-container normal">
        <div id="startScreen">
            <h1>SNAKE GAME</h1>
            <div class="controls-list">
                <strong>Arrow Keys</strong>: Move Snake | <strong>P Key</strong>: Pause<br>
                <strong>M Key</strong>: Hide Screen | <strong>T Key</strong>: Admin Panel
            </div>

            <div class="menu-section">
                <button id="regBtn" class="mode-btn selected">Regular</button>
                <button id="chaoticBtn" class="mode-btn">Chaotic</button>
            </div>

            <div id="difficultySection" class="menu-section" style="display: none;">
                <label for="diffSelect" style="font-size: 13px; margin-right: 5px; color: #ffa726;">Difficulty:</label>
                <select id="diffSelect" class="config-select">
                    <option value="easy">Easy (Head Only)</option>
                    <option value="normal" selected>Normal (Upper Half)</option>
                    <option value="hard">Hard (Entire Body)</option>
                </select>
            </div>

            <button id="startBtn">START</button>
        </div>
        <canvas id="gameCanvas" width="360" height="360"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');
        const modeToggle = document.getElementById('modeToggle');
        const scoreBoard = document.getElementById('scoreBoard');
        const fullScreenCover = document.getElementById('fullScreenCover');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const adminPanel = document.getElementById('adminPanel');
        const cmdInput = document.getElementById('cmdInput');
        const hollywoodOverlay = document.getElementById('hollywoodOverlay');
        const subhaanOverlay = document.getElementById('subhaanOverlay');

        const regBtn = document.getElementById('regBtn');
        const chaoticBtn = document.getElementById('chaoticBtn');
        const difficultySection = document.getElementById('difficultySection');
        const diffSelect = document.getElementById('diffSelect');

        const gridSize = 18;  
        const tileCount = 20; 

        let snake = [];
        let food = {x: 4, y: 7};
        
        let dx = 1; 
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        
        let currentX = 7;
        let currentY = 7;
        let moveProgress = 0; 

        let score = 0;
        let isGameOver = false;
        let isCompactMode = false;

        let isPaused = false;
        let showCoverImage = false;
        let gameHasStarted = false; 
        
        let isAdminActive = false;
        let snakeColorMode = 'normal'; 
        let rainbowHue = 0; 

        let isHollywoodMode = false;
        let hollywoodIntervals = [];

        let currentGameMode = 'regular'; 
        let selectedDifficulty = 'normal'; 
        let bombsArray = [];
        let explosionsArray = []; 
        let bombPulseTime = 0; 

        const speedFactor = 5.0;
        // Menu Mode Button Configuration Toggles
        regBtn.addEventListener('click', () => {
            currentGameMode = 'regular';
            regBtn.classList.add('selected');
            chaoticBtn.classList.remove('selected');
            difficultySection.style.display = 'none';
        });

        chaoticBtn.addEventListener('click', () => {
            currentGameMode = 'chaotic';
            chaoticBtn.classList.add('selected');
            regBtn.classList.remove('selected');
            difficultySection.style.display = 'block';
        });

        function initGame() {
            snake = [
                {x: 7, y: 7},
                {x: 6, y: 7},
                {x: 5, y: 7}
            ];
            currentX = 7;
            currentY = 7;
            moveProgress = 0;
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;
            score = 0;
            isGameOver = false;
            isPaused = false;
            showCoverImage = false;
            isAdminActive = false;
            adminPanel.style.display = 'none';
            fullScreenCover.style.display = 'none';
            hollywoodOverlay.style.display = 'none';
            subhaanOverlay.style.display = 'none';
            stopHollywood();
            scoreBoard.innerText = "Score: " + score;
            
            selectedDifficulty = diffSelect.value;
            bombsArray = [];
            explosionsArray = [];
            bombPulseTime = 0;

            spawnFood();

            // Set up initial roaming hazards if Chaotic parameters are satisfied
            if (currentGameMode === 'chaotic') {
                spawnBomb();
                spawnBomb();
            }
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameHasStarted = true;
            initGame();
        });

        function spawnBomb() {
            let fuseSetting = 10.0; // Hard difficulty fuse lifecycle
            if (selectedDifficulty === 'easy') fuseSetting = 18.0;
            else if (selectedDifficulty === 'normal') fuseSetting = 14.0;

            let newBomb = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount),
                fuse: fuseSetting,
                maxFuse: fuseSetting,
                moveTimer: 0
            };

            // Avoid overlaying onto food coordinates
            if (newBomb.x === food.x && newBomb.y === food.y) return spawnBomb();
            
            // Avoid overlaying onto existing snake body segments
            for (let part of snake) {
                if (part.x === newBomb.x && part.y === newBomb.y) return spawnBomb();
            }
            
            // Upgraded: Anti-clumping safety algorithm checks distance against all active bombs
            // Retries positioning until the new bomb is at least 5 tiles away from any other bomb
            for (let b of bombsArray) {
                let xDist = Math.abs(newBomb.x - b.x);
                let yDist = Math.abs(newBomb.y - b.y);
                if (xDist < 5 && yDist < 5) {
                    return spawnBomb(); // Cancel and re-roll coordinates to spread out
                }
            }
            
            bombsArray.push(newBomb);
        }
        // Catch input commands on Enter keypress
        cmdInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                let input = cmdInput.value.trim().toLowerCase();
                let args = input.split(' ');
                
                if (args[0] === '/points' && args[1] !== undefined) {
                    let newPoints = parseInt(args[1]);
                    if (!isNaN(newPoints) && newPoints >= 0) {
                        score = newPoints;
                        scoreBoard.innerText = "Score: " + score;

                        let targetLength = 3 + Math.floor(score / 10);
                        if (targetLength < 1) targetLength = 1;

                        while (snake.length < targetLength) {
                            let tail = snake[snake.length - 1] || { x: currentX, y: currentY };
                            snake.push({ x: tail.x, y: tail.y });
                        }
                        while (snake.length > targetLength) {
                            snake.pop();
                        }
                    }
                } else if (args[0] === '/colour' && args[1] !== undefined) {
                    if (args[1] === 'rainbow') {
                        snakeColorMode = 'rainbow';
                    } else {
                        snakeColorMode = args[1]; 
                    }
                } else if (args[0] === '/hollywood') {
                    startHollywood();
                } 
                else if (args[0] === '/subhaan') {
                    stopHollywood();
                    
                    const asciiArt = 
` ___       _      _                        _     _                        _ 
/  _|     | |    | |                      / \\   | |                      | |
\\  \\ _   _| |__  | |__   __ _  __ _ _ __   / _ \\  | |__  _ __ ___   ___  __| |
 _\\ \\ |_| | '_ \\ | '_ \\ / _\` |/ _\` | '_ \\ / ___ \\ | '_ \\| '_ \` _ \\ / _ \\/ _\` |

|___/\\__,_|_.__/ |_.__/ \\__,_|\\__,_|_| |_/_/   \\_\\|_| |_|_| |_| |_|\\___/\\__,_|`;
                    
                    subhaanOverlay.innerHTML = `<div class="slide-in-text">${asciiArt}</div>`;
                    subhaanOverlay.style.display = 'flex';
                }
                
                isAdminActive = false;
                adminPanel.style.display = 'none';
                cmdInput.blur();
            }
        });

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (isHollywoodMode) {
                    stopHollywood();
                    return;
                }
                if (subhaanOverlay.style.display === 'flex') {
                    subhaanOverlay.style.display = 'none';
                    return;
                }
            }

            if (document.activeElement === cmdInput) {
                if (e.key === 'Escape') {
                    isAdminActive = false;
                    adminPanel.style.display = 'none';
                    cmdInput.blur();
                }
                return;
            }

            if (!gameHasStarted || isHollywoodMode || subhaanOverlay.style.display === 'flex') return;

            if (e.key.toLowerCase() === 't') {
                e.preventDefault();
                isAdminActive = !isAdminActive;
                if (isAdminActive) {
                    adminPanel.style.display = 'block';
                    cmdInput.focus();
                    cmdInput.value = ''; 
                } else {
                    adminPanel.style.display = 'none';
                    cmdInput.blur();
                }
                return;
            }

            if (e.key.toLowerCase() === 'p') {
                if (!showCoverImage && !isGameOver && !isAdminActive) {
                    isPaused = !isPaused;
                }
                return;
            }

            if (e.key.toLowerCase() === 'm') {
                if (!isGameOver && !isAdminActive) {
                    showCoverImage = !showCoverImage;
                    isPaused = showCoverImage; 
                    fullScreenCover.style.display = showCoverImage ? 'block' : 'none';
                }
                return;
            }
            // Game movement inputs (only allowed if game is completely active)
            if (!isPaused && !showCoverImage && !isAdminActive) {
                switch(e.key) {
                    case 'ArrowUp':
                        if (dy !== 1) { nextDx = 0; nextDy = -1; }
                        break;
                    case 'ArrowDown':
                        if (dy !== -1) { nextDx = 0; nextDy = 1; }
                        break;
                    case 'ArrowLeft':
                        if (dx !== 1) { nextDx = -1; nextDy = 0; }
                        break;
                    case 'ArrowRight':
                        if (dx !== -1) { nextDx = 1; nextDy = 0; }
                        break;
                }
            }

            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                if(isGameOver) initGame();
            }
        });

        modeToggle.addEventListener('click', () => {
            isCompactMode = !isCompactMode;
            if (isCompactMode) {
                modeToggle.classList.add('active');
                modeToggle.innerText = "Compact Mode: ON";
                container.className = "canvas-container compact";
            } else {
                modeToggle.classList.remove('active');
                modeToggle.innerText = "Toggle Compact Mode";
                container.className = "canvas-container normal";
            }
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                    break;
                }
            }
            for (let b of bombsArray) {
                if (b.x === food.x && b.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function startHollywood() {
            isHollywoodMode = true;
            hollywoodOverlay.style.display = 'block';
            hollywoodOverlay.innerHTML = ''; 

            const columnsCount = Math.floor(window.innerWidth / 300) || 1;
            const widthPct = 100 / columnsCount;

            const fakeScripts = [
                () => `[${new Date().toLocaleTimeString()}] INITIATING TCP/IP HANDSHAKE BYPASS... \n[STATUS] ACCESS GRANTED TO NODE_${Math.floor(Math.random()*9000+1000)}\n`,
                () => `root@kernel:~# apt-get download coreutils-sys-bin\nUnpacking objects: ${Math.floor(Math.random()*100)}% (${Math.floor(Math.random()*500)}/512 pairs)\n`,
                () => `wget -qO- https://github.com\nHTTP/1.1 200 OK\nContent-Type: application/json\n`,
                () => `0x${Math.floor(Math.random()*16777215).toString(16).toUpperCase()} -> CONNECTED TO COMPILER GATEWAY BUFFER_OVERFLOW_SAFE\n`,
                () => `inject --payload=stack_pivot --target=0x7FFF${Math.floor(Math.random()*900+100)}\n[WARNING] MEMORY ADDRESS ALIGNMENT STABLE\n`
            ];

            for (let i = 0; i < columnsCount; i++) {
                let col = document.createElement('div');
                col.className = 'matrix-column';
                col.style.width = widthPct + "%";
                col.style.left = (i * widthPct) + "%";
                hollywoodOverlay.appendChild(col);

                let interval = setInterval(() => {
                    let randomLine = fakeScripts[Math.floor(Math.random() * fakeScripts.length)]();
                    col.innerHTML += randomLine;
                    
                    if (col.offsetHeight > window.innerHeight - 50) {
                        col.innerHTML = col.innerHTML.substring(randomLine.length * 2);
                    }
                }, Math.floor(Math.random() * 200 + 150));

                hollywoodIntervals.push(interval);
            }
        }

        function stopHollywood() {
            isHollywoodMode = false;
            hollywoodOverlay.style.display = 'none';
            hollywoodIntervals.forEach(clearInterval);
            hollywoodIntervals = [];
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000; 
            lastTime = timestamp;

            if (gameHasStarted && !isGameOver && !isPaused && !showCoverImage && !isAdminActive && !isHollywoodMode && subhaanOverlay.style.display !== 'flex') {
                update(dt);
            }
            draw();

            requestAnimationFrame(gameLoop);
        }
        function update(dt) {
            bombPulseTime += dt * 12;

            if (currentGameMode === 'chaotic') {
                // 1. Process active explosions lifecycle counters
                for (let i = explosionsArray.length - 1; i >= 0; i--) {
                    explosionsArray[i].duration -= dt;
                    if (explosionsArray[i].duration <= 0) {
                        explosionsArray.splice(i, 1);
                    }
                }

                // 2. Process active ticking bombs logic
                for (let i = bombsArray.length - 1; i >= 0; i--) {
                    let bomb = bombsArray[i];
                    bomb.fuse -= dt;
                    bomb.moveTimer += dt;

                    // Moving Bombs: Adjust position coordinates randomly every 1.5 seconds
                    if (bomb.moveTimer >= 1.5) {
                        bomb.moveTimer = 0;
                        
                        let directions = [
                            {x: 0, y: -1}, {x: 0, y: 1}, 
                            {x: -1, y: 0}, {x: 1, y: 0}
                        ];
                        let randomDir = directions[Math.floor(Math.random() * directions.length)];
                        let newX = bomb.x + randomDir.x;
                        let newY = bomb.y + randomDir.y;

                        // Verify boundary walls and structural obstacle safety rules
                        if (newX >= 0 && newX < tileCount && newY >= 0 && newY < tileCount) {
                            let spaceOccupied = false;
                            if (newX === food.x && newY === food.y) spaceOccupied = true;
                            for (let part of snake) {
                                if (part.x === newX && part.y === newY) spaceOccupied = true;
                            }
                            if (!spaceOccupied) {
                                bomb.x = newX;
                                bomb.y = newY;
                            }
                        }
                    }

                    // Explosion Blast Radius: Generate explosion cells when fuse counts down
                    if (bomb.fuse <= 0) {
                        // Create a cross-shaped blast pattern outward from epicenter block
                        let radius = 2; 
                        explosionsArray.push({ x: bomb.x, y: bomb.y, duration: 0.6 }); // Center point
                        
                        for (let r = 1; r <= radius; r++) {
                            if (bomb.x + r < tileCount) explosionsArray.push({ x: bomb.x + r, y: bomb.y, duration: 0.6 });
                            if (bomb.x - r >= 0)        explosionsArray.push({ x: bomb.x - r, y: bomb.y, duration: 0.6 });
                            if (bomb.y + r < tileCount) explosionsArray.push({ x: bomb.x, y: bomb.y + r, duration: 0.6 });
                            if (bomb.y - r >= 0)        explosionsArray.push({ x: bomb.x, y: bomb.y - r, duration: 0.6 });
                        }

                        bombsArray.splice(i, 1);
                        spawnBomb();
                    }
                }
            }

            moveProgress += dt * speedFactor;

            if (moveProgress >= 1.0) {
                moveProgress -= 1.0;
                
                dx = nextDx;
                dy = nextDy;

                currentX += dx;
                currentY += dy;

                if (currentX < 0 || currentX >= tileCount || currentY < 0 || currentY >= tileCount) {
                    isGameOver = true;
                    return;
                }

                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === currentX && snake[i].y === currentY) {
                        isGameOver = true;
                        return;
                    }
                }

                // --- CHAOTIC PROXIMITY AND BLAST COLLISION CHECKS ---
                if (currentGameMode === 'chaotic') {
                    let elementsToTest = [];

                    if (selectedDifficulty === 'easy') {
                        elementsToTest.push(snake[0]); // Head position only
                    } else if (selectedDifficulty === 'normal') {
                        let checkLimit = Math.ceil(snake.length / 2);
                        for (let idx = 0; idx < checkLimit; idx++) {
                            elementsToTest.push(snake[idx]);
                        }
                    } else if (selectedDifficulty === 'hard') {
                        elementsToTest = [...snake]; // Entire structural length array
                    }

                    // Check live active fire grids
                    for (let blast of explosionsArray) {
                        for (let segment of elementsToTest) {
                            if (segment && segment.x === blast.x && segment.y === blast.y) {
                                isGameOver = true;
                                return;
                            }
                        }
                    }

                    // Check live proximity threat limits to moving ticking fields
                    for (let bomb of bombsArray) {
                        for (let segment of elementsToTest) {
                            if (segment) {
                                let xDist = Math.abs(segment.x - bomb.x);
                                let yDist = Math.abs(segment.y - bomb.y);
                                if (xDist <= 1 && yDist <= 1) {
                                    isGameOver = true;
                                    return;
                                }
                            }
                        }
                    }
                }

                snake.unshift({x: currentX, y: currentY});

                if (currentX === food.x && currentY === food.y) {
                    score += 10;
                    scoreBoard.innerText = "Score: " + score;
                    spawnFood();

                    if (currentGameMode === 'chaotic' && score % 20 === 0) {
                        spawnBomb();
                    }
                } else {
                    snake.pop();
                }
            }
        }
        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            if (gameHasStarted) {
                // Render Point Orbs
                ctx.fillStyle = '#ff5722';
                ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

                // --- RENDERING DETONATION FIRE CLOUD CELLS ---
                if (currentGameMode === 'chaotic') {
                    ctx.fillStyle = 'rgba(255, 102, 0, 0.75)'; // Bright fiery orange blast layout
                    explosionsArray.forEach(blast => {
                        ctx.fillRect(
                            blast.x * gridSize + 1, 
                            blast.y * gridSize + 1, 
                            gridSize - 2, 
                            gridSize - 2
                        );
                    });

                    // Render Roaming Bomb Orbs
                    bombsArray.forEach(bomb => {
                        let fusePercent = bomb.fuse / bomb.maxFuse;
                        let pulseSpeedModifier = fusePercent < 0.35 ? 2.5 : 1.0;
                        let opacityAlphaValue = 0.4 + 0.5 * Math.abs(Math.sin(bombPulseTime * pulseSpeedModifier));

                        // Warning radius glow circle path layers
                        ctx.fillStyle = `rgba(211, 47, 47, ${opacityAlphaValue * 0.25})`;
                        ctx.beginPath();
                        ctx.arc(
                            bomb.x * gridSize + gridSize / 2,
                            bomb.y * gridSize + gridSize / 2,
                            gridSize * 1.5,
                            0,
                            2 * Math.PI
                        );
                        ctx.fill();

                        // Main flashing explosive tracking orb vector circle structures
                        ctx.fillStyle = `rgba(255, 23, 68, ${opacityAlphaValue})`;
                        ctx.beginPath();
                        ctx.arc(
                            bomb.x * gridSize + gridSize / 2,
                            bomb.y * gridSize + gridSize / 2,
                            (gridSize / 2) - 1,
                            0,
                            2 * Math.PI
                        );
                        ctx.fill();

                        // Core timeline countdown reference indicator pip points
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(
                            bomb.x * gridSize + gridSize / 2,
                            bomb.y * gridSize + gridSize / 2,
                            2,
                            0,
                            2 * Math.PI
                        );
                        ctx.fill();
                    });
                }

                if (snakeColorMode === 'rainbow') {
                    rainbowHue = (rainbowHue + 2) % 360;
                }

                snake.forEach((part, index) => {
                    let renderX = part.x;
                    let renderY = part.y;

                    let effectiveProgress = moveProgress;
                    if (isPaused || isAdminActive || isHollywoodMode || subhaanOverlay.style.display === 'flex' || isGameOver) {
                        effectiveProgress = 0; 
                    }

                    if (index === 0) {
                        renderX = (part.x - dx) + (dx * effectiveProgress);
                        renderY = (part.y - dy) + (dy * effectiveProgress);
                    } else {
                        let prevPart = snake[index - 1];
                        renderX = prevPart.x + (part.x - prevPart.x) * (1 - effectiveProgress);
                        renderY = prevPart.y + (part.y - prevPart.y) * (1 - effectiveProgress);
                    }

                    if (snakeColorMode === 'rainbow') {
                        ctx.fillStyle = `hsl(${(rainbowHue + index * 15) % 360}, 85%, 55%)`;
                    } else if (snakeColorMode !== 'normal') {
                        ctx.fillStyle = snakeColorMode; 
                    } else {
                        ctx.fillStyle = index === 0 ? '#8bc34a' : '#4CAF50'; 
                    }
                    
                    ctx.beginPath();
                    ctx.arc(
                        renderX * gridSize + gridSize / 2, 
                        renderY * gridSize + gridSize / 2, 
                        (gridSize / 2) - 1, 
                        0, 
                        2 * Math.PI
                    );
                    ctx.fill();
                });
            }

            if (isPaused && !isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Game Paused', canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = '14px sans-serif';
                ctx.fillText('Press P to Resume', canvas.width / 2, canvas.height / 2 + 20);
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = '14px sans-serif';
                ctx.fillText('Press an Arrow Key to restart', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
